name: Ideia
description: Sugira uma melhoria ou algo novo
labels: [enhancement]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qual problema isso resolve
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Como você imagina a solução
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas que você considerou
